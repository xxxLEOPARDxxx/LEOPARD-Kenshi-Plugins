; RecruitMarkers - значок над головой у тех, кого можно нанять.
; Замена LtEast's Recruitable NPC Highlighter.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке «Моды»
; окна «Настройки» игры (нужен мод ModConfigMenu).

[RecruitMarkers]

; 0 - никаких значков.
Enabled=1

; Значки видны, пока зажата клавиша (ALT, CTRL+B, ...). NONE - видны всегда.
HoldKey=ALT

; Кого отмечать: уникальных (именных) персонажей, обычных наёмников,
; животных.
ShowUnique=1
ShowGeneric=1
ShowAnimals=1
; Торговцы - стопка монет над головой (торгующего и нанимаемого - оба значка).
ShowTraders=1

; 1 - только тех, кого игра даст нанять прямо сейчас: условия диалога
; (деньги, отношения, плен и т.д.) проверяются для ближайшего выделенного
; персонажа. 0 - всех, у кого в диалоге вообще есть вступление в отряд.
CheckConditions=1

; Цвета значков, #RRGGBB: уникальные и обычные (животные - обычным).
UniqueColour=#fff499
GenericColour=#ffbe66
; Цвет монеты над торговцами.
TraderColour=#80e0ff

; Ширина значка в пикселях (12..96), непрозрачность 1..10.
IconSize=40
Opacity=8

; Значки уникальных персонажей мягко пульсируют.
PulseUnique=1

; Высота над костью головы, см (0..300).
HeightAboveHead=40

; Дальше этого расстояния от центра камеры, м, не отмечать (20..5000).
MaxDistance=150

; Больше значков не показывать - ближайшие (8..128).
MaxMarkers=64

; Подробности в RE_Kenshi_log.txt.
Debug=0
