; RangedDamageXp - опыт стрелку ещё и за нанесённый урон.
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[RangedDamageXp]
; 0 - плагин выключен.
Enabled=1

; Сколько «события» опыта даёт единица урона. Дальше игра считает сама:
; расовый множитель, кривая и потолок XP_Overhaul.
; Урон - тот, что дошёл до тела: после брони, стойкости цели и общего
; множителя урона. Выстрел в тяжёлый доспех даёт меньше, чем в голого.
; Для ориентира: у игры прицеливание даёт Арбалетам опыт каждую секунду,
; пока стрелок в режиме стрельбы. При 0.02 попадание на ~70 нанесённого
; урона даёт примерно столько же, сколько секунда прицеливания.
XpPerDamage=0.02

; Потолок события за одно попадание (3 - это ~150 урона при 0.02), чтобы
; один удачный болт в упор не давал слишком много. Поднимаешь
; XpPerDamage - поднимай и его, иначе всё упрётся в потолок. 0 - без
; потолка. Ориентир: событие 1 - это около +0.011 уровня на первых
; уровнях (дальше меньше, по кривой).
MaxPerHit=3

; Попадания слабее этого урона не считаются (царапины по броне).
MinDamage=1

; Доля прибавки, которая идёт Восприятию. 0 - Восприятие не трогаем.
PerceptionShare=0.25

; 1 - выстрелы из турели качают навык «Турели», 0 - турели без прибавки.
Turrets=1

; 1 - давать опыт и за попадания по своим. По умолчанию нет: иначе
; выгодно стрелять по своим.
Allies=0

; 1 - давать опыт и за попадания по лежачим (без сознания).
DownedTargets=0

; 1 - строка в RE_Kenshi_log.txt на каждое засчитанное попадание:
; кто, по кому, урон, событие, уровень до и после. Нужна для настройки.
Debug=1
