; BestMinimap - миникарта в углу экрана.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке «Моды»
; окна «Настройки» игры (нужен мод ModConfigMenu). Размер, масштаб, место и
; «показана / скрыта» плагин сам записывает сюда, когда их меняют мышью или
; клавишами.

[BestMinimap]

; 0 - миникарты нет вовсе.
Enabled=1

; Показана ли сейчас (то же, что клавиша KeyToggle).
Visible=1

; Клавиши: «CTRL+M», «=», «F5», «NUM5»... NONE - клавиши нет.
KeyToggle=CTRL+M
KeyZoomIn==
KeyZoomOut=-
KeyBigger=CTRL+=
KeySmaller=CTRL+-
; Проба «вида со спутника» (опыт): снимки в папку мода, satellite_probe_*.bmp
; - вид игры как есть и вид сверху камерой игры (квадрат до 2 км вокруг
; центра миникарты). Пока снимает, игра рисует мир дважды: пара секунд с
; просадкой; на кадр каждого снимка мигает интерфейс, а на снимках сверху
; на экране мигает и вид сверху.
SatelliteShotKey=CTRL+SHIFT+Y

; Форма: circle (круг), square (квадрат), rect (прямоугольник).
Shape=circle

; Размер в пикселях экрана: круг - диаметр, квадрат - сторона,
; прямоугольник - ширина (он всегда 16:10, высота считается из ширины).
; CTRL+колесо над миникартой тоже меняет размер.
Size=220

; Место на экране, левый верхний угол. -1 - правый верхний угол экрана.
; Тащится левой кнопкой мыши, если Locked=0.
Left=-1
Top=-1
Locked=0

; Обзор: метров от центра до края. Колесо над миникартой и клавиши
; KeyZoomIn / KeyZoomOut тоже его меняют. В картинке карты игры около 70 м
; на пиксель, поэтому ближе примерно 1500 м она расплывается.
Range=2000

; 1 - карта поворачивается за камерой (вверху - куда смотрит камера);
; 0 - север всегда сверху.
RotateWithCamera=0

; 1 - центр миникарты на выделенных персонажах; 0 - на центре камеры.
CenterOnSelected=0

; Стрелка в центре: куда смотрит камера.
ShowView=1

; Рамка: none (нет), line (линия), game (панель игры: оформление родных
; панелей игры и модов на интерфейс; у круга - линия цвета палитры игры).
Frame=line

; Цвет рамки: auto - из палитры игры (и модов на интерфейс) или #RRGGBB.
FrameColour=auto

; Цвет там, где картинка карты кончается.
BackgroundColour=#1E1C19

; Непрозрачность карты, 1-10 (шаг 10%). Точки и метки - всегда непрозрачные.
Opacity=10

; Размер точки персонажа, пикселей.
DotSize=5

; Кого показывать.
ShowSquad=1
ShowAllies=1
ShowNeutrals=1
ShowEnemies=1
ShowAnimals=1
; Мёртвые - блёкло.
ShowDead=0

; Цвета: auto - каким цветом игра отмечает этого персонажа на большой карте,
; или #RRGGBB.
ColourSquad=auto
ColourAllies=auto
ColourNeutrals=auto
ColourEnemies=auto
ColourAnimals=#C8B48C

; Носик у точки: куда смотрит персонаж. FacingFlip=1 - если носики
; смотрят назад.
ShowFacing=1
FacingFlip=0

; Имена персонажей под точками.
CharacterNames=0

; Награда за голову (вся, как «$» над головой): кольцо и сумма.
ShowBounty=1
BountyColour=#F2C230

; Названия отрядов над их лидерами: none (нет), others (чужие), all (все).
SquadLabels=others
SquadLabelColour=#E6C84A

; Поселения и прочие места большой карты: значок, название, круг радиуса.
ShowTowns=1
TownNames=1
; Названия - пока обзор не шире этого, м: на всей карте слились бы.
TownNamesRange=8000
TownRadius=1
; Значки: game - как на большой карте игры (из её интерфейса и модов на
; интерфейс), diamond - ромбы. Местам, у которых значка нет, - ромб.
TownIcons=game
TownIconSize=22
; Высота названий поселений, пикселей. 0 - как прочие подписи.
TownNameSize=0
; auto - по отношениям фракции поселения к вашей (красное - враги,
; зелёное - союзники) или #RRGGBB.
TownColour=auto

; Подсказка при наведении мыши на поселение или персонажа.
Tooltips=1

; ПКМ по миникарте - выделенные идут в эту точку.
RightClickMove=1

; Метки мода Map-markers (из файла Map-markers.json текущего сохранения).
MapMarkers=1

; Цели мода WantedMap - на момент последнего взгляда на большую карту.
WantedMarkers=1

; Метки Map-markers и WantedMap за пределами обзора остаются у края
; миникарты и показывают направление.
PinToEdge=1

; Тревога: персонажа вашей фракции атакуют - на миникарте пульсирующее
; кольцо на месте атаки (за пределами обзора - у края, показывает
; направление). Держится AlertSeconds после последней атаки.
AttackAlert=1
AlertColour=#FF3B30
AlertSeconds=8
; Ещё и строка в сообщениях игры: "Под атакой: имена" - не чаще раза в 3 с.
AlertMessage=1
; Рамка миникарты мигает цветом тревоги.
AlertFlashFrame=1

; Тонкая линия вокруг ваших персонажей: дальше неё камеру не отвести.
ShowCameraRange=1
; Предел в метрах. 0 - плагин узнаёт его сам: один раз отведите камеру от
; своих до упора, и линия встанет на это расстояние (оно запоминается в
; CameraRangeLearned).
CameraRange=0
CameraRangeLearned=0
CameraRangeColour=#E8E2D0
; Линия: dots (пунктир) или line (сплошная).
CameraRangeStyle=dots

; Обновлений миникарты в секунду. Меньше - меньше работы процессору.
UpdateFps=20

; Картинка карты больше этого размера (по большей стороне) уменьшается в
; памяти до него. 4096 - 64 МБ памяти. Действует после перезапуска игры.
MaxSourceSize=4096

; Если цвета миникарты не те (синий песок вместо жёлтого) - 1.
SwapRedBlue=0

; Подробный журнал в RE_Kenshi_log.txt.
Debug=0
