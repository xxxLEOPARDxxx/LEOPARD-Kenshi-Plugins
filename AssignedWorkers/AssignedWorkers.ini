; AssignedWorkers — кто из отряда закреплён за выделенной постройкой.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[AssignedWorkers]

; 0 отключает плагин целиком.
Enabled=1

; Клавиша показа: панель у окна постройки видна, только пока клавиша
; зажата. ALT, CTRL, SHIFT или NONE — видна всегда.
; Учтите: на ALT в сборке ещё подсвечиваются персонажи и сундуки
; (Vital-Sense, Container-Highlight) и работает GearCompare — это не
; мешает, просто совпадёт.
HoldKey=ALT

; У своей постройки, за которой никто не закреплён, показывать панель
; с надписью «никто». 0 — у такой постройки панели нет вовсе.
; У чужих построек «никто» не пишется никогда: там это шум.
ShowNobody=1

; Клавиша «выделить свободных»: все ваши персонажи без цели и без
; текущего действия (в окне персонажа «Цель: Нет цели»), в сознании, не в
; клетке, выделяются разом. Любая клавиша или сочетание; NONE - нет.
SelectIdleKey=CTRL+SHIFT+I
; Каких выделять: не приписанные к постройке (станку, машине)... «Медик»,
; «Роботехника» и подобные работы приписью не считаются.
SelectIdleNoJobs=1
; ...и приписанные, но без цели (станку нечего делать, место занято).
SelectIdleWithJobs=0

; Подробности в RE_Kenshi_log.txt: у каждой выделенной постройки —
; куда смотрят работы всех персонажей и кого нашли; по клавише свободных -
; почему каждый персонаж свободен или нет.
Debug=0
