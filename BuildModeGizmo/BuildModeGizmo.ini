; BuildModeGizmo - стрелочки перемещения для своей стройплощадки.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[BuildModeGizmo]

; 0 отключает плагин целиком.
Enabled=1

; Стрелочки на своей стройплощадке в обычной игре: выделяешь своё ещё не
; построенное здание - на нём стрелочки, тянешь - сдвигается, кнопка
; окна - поворот. Закрыть окно крестиком - стрелочки пропадут.
SiteArrows=1

; 1 - после того как стрелку отпустили, здание перестраивается и игра ставит
; его на землю (как было). 0 - остаётся на высоте, до которой его подняли.
SnapToGround=1

; Первая версия: стрелочки в обычном режиме строительства меню
; разработчика (Shift+F12). Не подтвердилась, по умолчанию выключена.
; Две настройки ниже (SkipDuringPlacement, ApplyChanges) - только для неё.
EditorArrows=0

; Не трогать стрелочки, пока игрок ведёт по земле новую постройку:
; щелчок в этот момент должен ставить здание, а не хватать стрелочку.
; Выключайте, только если стрелочки не появляются вовсе - в журнале на
; этот случай есть строка «object placement is active».
SkipDuringPlacement=1

; Дописывать сдвиг в здание самим. Нужно только если здание двигается
; на экране, но сдвиг не сохраняется: обычно игра делает это сама, и
; лишнее вмешательство только мешает.
ApplyChanges=0

; Подробности в RE_Kenshi_log.txt: кто вызвал стрелочки в этом кадре -
; игра или плагин, что там с выделением и окном преобразования.
Debug=0
