; WantedMap - метки разыскиваемых на большой карте.
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[WantedMap]
; 0 - плагин выключен.
Enabled=1

; Как часто, пока открыта карта, проверять листовки у выделенных (секунды).
ScanSeconds=2

; Как часто, пока открыта карта, заново искать отряды целей по миру
; (секунды). Между поисками обновляются только позиции найденных.
WorldScanSeconds=30

; 1 - подпись с именем рядом с меткой.
ShowLabels=1

; 1 - если отряд цели ещё ни разу не появлялся, ставить метку на
; поселение или лагерь, где он живёт по данным игры.
TownFallback=1

; 1 - помнить, какие цели уже были в мире и кто убит, где и когда
; (файл на прохождение в папке memory рядом с DLL).
RememberSeen=1

; Сколько игровых часов после смерти показывать серую метку «убит» на
; месте смерти. 0 - убитых не показывать вовсе.
DeadMarkerHours=24

; 1 - подробности в RE_Kenshi_log.txt и таблица подобранных целей в
; WantedMap_runtime_table.txt рядом с DLL.
Debug=0

[Match]
; Слова, которые не считаются общими при сравнении имени из листовки с
; именем персонажа (через запятую, любой язык, файл в UTF-8).
StopWords=the,of,and,wanted,king,boss,leader,из,банды,и,король,лидер,лидеры,глава
