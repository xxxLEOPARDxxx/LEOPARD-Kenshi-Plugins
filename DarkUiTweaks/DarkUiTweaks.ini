; DarkUiTweaks — то, чего не сделать вёрсткой.
;
; Правит то, что игра строит своим кодом, а не разметкой, поэтому
; работает с любым интерфейсом. Что делает каждая настройка — ниже и
; в README.txt.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[Tweaks]

; 0 отключает плагин целиком.
Enabled=1

; Высота строки в очередях исследований и ремесла, в пикселях.
; Игра даёт им около 16, и на русских шрифтах текст не помещается —
; строки налезают друг на друга.
; 0 оставляет игровую высоту.
QueueRowHeight=30

; Отступ полосы заполнения от края строки, в пикселях.
; Игра считает сто процентов полосы по ширине надписи со временем
; («2 hrs»), а не по рамке строки, — из-за этого заливка не доходила до
; конца. Плагин прячет игровую полосу и рисует свою, во всю рамку.
; У рамки скина шесть пикселей, но пятый встаёт вплотную к чёрной линии.
; 0 отключает пересчёт и оставляет полосу игре.
QueueBarInset=5

; Сколько рядов портретов как минимум помещается в ячейке отряда на
; вкладке «Отряды» без обрезки. Игра даёт ячейке высоту на полтора ряда.
; Плагин меряет ящик портретов и добавляет ячейке недостающее.
; 0 оставляет игровую высоту.
SquadPortraitRows=2

; Растягивать ячейки, когда самому большому отряду нужно больше рядов,
; чем SquadPortraitRows (новый боец — новый ряд). Высота у всех ячеек
; списка одна — так устроен список игры, — поэтому растут все. 0 — ровно
; SquadPortraitRows рядов, лишние бойцы уходят под прокрутку.
SquadAutoGrow=1

; Полоса в строке панели описания — «Следующий уровень» у навыка.
; Игра делает её тонкой, заливка лежит поверх чёрной каймы. Плагин
; делает рамку выше на столько пикселей сверху и снизу, заливку
; вписывает внутрь каймы (как в очереди исследований), текст — по
; середине, а всё, что ниже, сдвигает.
; 0 оставляет полосу игре.
ProgressBarPad=5

; На сколько пикселей опустить эту полосу с рамкой, не трогая текст.
; Шрифт сидит в своей строке высоко, и по середине полосы текст
; выглядит, только если полоса чуть ниже. Строки под ней уходят вниз
; на столько же.
ProgressBarDrop=2

; На сколько пикселей поднять верхний край этой полосы с рамкой;
; нижний край и текст остаются на месте.
ProgressBarGrowUp=1

; Включить полосу прокрутки у панелей описания. У панели есть штатный
; флаг прокрутки, игра передаёт его нулём; плагин передаёт единицу.
ScrollDescription=1

; После названия фракции выбранного персонажа - её отношение к вам,
; как в окне фракций игры: «Кочевники (+15)». Зелёным - выше нуля,
; красным - от -10 и ниже (там уже нападают); между -10 и 0 - без цвета.
FactionRelation=1

; Во вкладке «Ремесло»: при наведении на строку списка «Предметы» у мыши -
; иконка вещи (иконки игра рисует сама, data/icons).
CraftIcon=1
; Иконка видна, пока зажата эта клавиша (ALT, CTRL+B, ...); NONE - просто
; по наведению.
CraftIconKey=ALT

; 1 — выписывать в RE_Kenshi_log.txt все создаваемые панели описания
; и их флаги. Нужно, если прокрутка не появилась: сразу видно, ту ли
; панель мы ловим.
Debug=0
