; LiveXpBars — полосы опыта тех навыков, которые качаются прямо сейчас.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[Bars]

; 0 отключает плагин целиком.
Enabled=1

; Сколько секунд полоса держится после прибавки опыта. Это главный
; параметр: прибавка видна ровно один кадр, и без удержания полоса
; успевала бы только мигнуть.
HoldSeconds=3

; Время появления полосы, секунды.
FadeInSeconds=1

; Время затухания. Начинается, когда удержание вышло.
FadeOutSeconds=5

; Прятать полосы, пока выделено больше одного персонажа: у каждого свои
; навыки, и на экране вышла бы каша.
HideForSquad=1

; 1 — навык, который хоть раз прокачался, остаётся на экране и не
; гаснет, пока не выделен другой персонаж. 0 — строка гаснет через
; HoldSeconds после последней прибавки.
AlwaysShow=0

; 1 — прятать полосы вместе с интерфейсом игры (F7, «Показать основной
; интерфейс»). 0 — полосы видны и при спрятанном интерфейсе.
HideWithGUI=1

; Где стоят полосы. SHIFT+B показывает рамку, за которую их можно
; перетащить; место сохраняется сюда само.
Left=40
Top=260

; Ширина строки в пикселях. Из неё вычитаются название, уровень и
; проценты, остальное отдаётся полосе.
Width=460

; Ширина колонки названия навыка, px (40..300): уровень идёт сразу за ней.
; Меньше - уровень ближе к названию; слишком мало - длинные названия обрежутся.
NameWidth=150

; Промежуток между колонками: названием, уровнем, процентами и полосой, px
; (-30..40). Меньше нуля - колонки ближе друг к другу.
ColumnGap=8

; Добавочное расстояние между строками в пикселях (-8..40). Меньше нуля -
; строки ближе друг к другу.
RowSpacing=0

; Красить ли уровень навыка и проценты по величине. Уровень - по самому
; навыку, проценты - по прогрессу до следующего уровня: только начал -
; тускло, близко к уровню - ярко.
ColourLevel=1
ColourPercent=1

; 1 - писать в RE_Kenshi_log.txt, кого плагин считает выбранным,
; сколько персонажей выделено и сколько навыков растёт.
Debug=0


[Colours]

; skin — не трогать цвет, пусть его даёт скин виджета. Строки полос
; сделаны тем же скином, что и строки окна навыков, поэтому подписи
; совпадают с игровыми сами собой. Это же советует Asur: если у скина
; цвет задан, из кода его не перекрывать.
;
; auto — взять из палитры игры, data/gui/colours/kenshi_colours.xml
; (и из мода на интерфейс, если он её перекрыл).
;
; Можно вписать и свой #RRGGBB.
;
; Name  — название навыка.
; Plain — уровень и проценты, когда их окраска выключена.
; Hint  — подсказка в режиме настройки.
Name=skin
Plain=skin
Hint=skin

; Цвет заливки полосы.
;   value  — по той же шкале, что проценты: только начал — тускло,
;            близко к уровню — ярко;
;   skin   — как рисует игра (заливку там еле видно);
;   #RRGGBB — свой цвет.
BarColour=value

; 1 — цвета уровня, процентов и заливки меняются плавно: ступени
; LevelN ниже — опорные точки, между ними цвет смешивается. 0 — как
; раньше, цвет меняется раз в десять единиц.
SmoothColours=1

; Подложка под полосами — там, где земля светлая и текст плохо видно.
; none — без подложки; #RRGGBB — ровная заливка этим цветом;
; game — игровая панель с рамкой, как у всплывающих описаний (одна
; на все строки, растёт вместе с ними). Гаснет вместе со строками.
; Готовые цвета для заливки:
;   #000000 — чёрный
;   #121212 — почти чёрный
;   #1E1E1E — очень тёмный серый
;   #2B2B2B — тёмно-серый
;   #3A3A3A — серый потемнее
;   #4D4D4D — серый
;   #26221C — тёмная охра, под цвет окон игры
;   #1C2226 — тёмный сине-серый
; BackgroundOpacity — насколько подложка плотная: 0 — прозрачная,
; 1 — сплошная. 0.5–0.7 — текст читается, а мир под ней ещё видно.
; Настройки читаются при запуске игры — после правки перезапустите.
Background=none
BackgroundOpacity=0.6

; Ступени те же, что в StatColours, и ключи названы так же - можно
; перенести подобранные цвета копированием. LevelN - для значений от N
; до N+9, Level100 - ровно сто, Above100 - выше сотни.
Level0=#8C3A3A
Level10=#A34A42
Level20=#B25E42
Level30=#BE7644
Level40=#C79149
Level50=#CBAA52
Level60=#C2B25A
Level70=#AEB25E
Level80=#96AC5F
Level90=#7EA560
Level100=#6C9E63
Above100=#9A7BC8
