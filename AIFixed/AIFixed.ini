; AI Fixed - точечные правки ИИ. Каждая включается отдельно.
[AIFixed]
; 0 - плагин выключен целиком (после изменения - перезапуск игры).
Enabled=1

; Раненого скелета несут на свободную ремкровать, а не на обычную кровать.
; Свободной ремкровати рядом нет - на обычную, как в игре.
SkeletonRepairBeds=1

; 1 - подробности в RE_Kenshi_log.txt: для кого искали ремкровать и какую нашли.
Debug=0
