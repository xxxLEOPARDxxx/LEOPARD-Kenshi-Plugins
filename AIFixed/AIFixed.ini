; AI Fixed - точечные правки ИИ. Каждая включается отдельно.
[AIFixed]
; 0 - плагин выключен целиком (после изменения - перезапуск игры).
Enabled=1

; Раненого скелета несут на свободную ремкровать, а не на обычную кровать.
; Свободной ремкровати рядом нет - на обычную, как в игре.
SkeletonRepairBeds=1

; Саморемонт: скелет или живой с протезами, у кого износ какой-нибудь части
; выше порога, сам идёт на ближайшую свободную ремкровать с питанием, лежит
; до полной починки и возвращается к работе. Не в бою, не когда несёт кого-то.
SelfRepair=1
; Порог износа части (0-100).
SelfRepairWear=50

; 1 - подробности в RE_Kenshi_log.txt: для кого искали ремкровать и какую нашли.
; Полный режим включается после перезапуска; выключение гасит записи сразу.
Debug=0
