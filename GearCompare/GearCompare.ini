; GearCompare — сравнение вещи под курсором с тем, что надето.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[GearCompare]

; 0 отключает плагин целиком.
Enabled=1

; Клавиша показа: панель видна, только пока она зажата.
; ALT, CTRL, SHIFT или NONE — видна всегда.
; Учтите: на ALT в сборке ещё подсвечиваются персонажи и сундуки
; (Vital-Sense, Container-Highlight) — это не мешает, просто совпадёт.
HoldKey=ALT

; Сравнивать и с пустым слотом («Надето: ничего»). 0 — при пустом слоте
; панели нет: оружие сравнивается только с надетым (того же типа или
; с тем, что в подходящем слоте), броня — только с надетой в том же слоте.
CompareEmptySlot=0

; Итоговый процент внизу панели. По умолчанию выключен: разные свойства
; не складываются честно в одно число, и вместо него показаны три оси и
; вердикт. Если включить, итог считается так:
;   главная ось (защита или урон), %
;   + TotalPerProperty за каждое свойство, ставшее лучше
;   − TotalPerProperty за каждое, ставшее хуже
;   − TotalPerKg за каждый лишний килограмм.
ShowTotal=0
TotalPerProperty=3
TotalPerKg=2

; Цвета «лучше» и «хуже». auto — как в игровом окошке вещи (цвет чисел
; «+2» и «-1»); #RRGGBB — свой цвет. Остальные цвета панели всегда берутся
; у игрового окошка: название, подзаголовки, подписи и значения.
ColourBetter=auto
ColourWorse=auto

; Подробности в RE_Kenshi_log.txt: что под курсором, для кого, с чем
; сравнивается и сырые числа вещи. Пишется только при смене вещи.
Debug=0
