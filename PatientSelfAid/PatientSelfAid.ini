; PatientSelfAid — пациент лечит себя сам, пока его лечат.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[PatientSelfAid]

; 0 отключает плагин целиком.
Enabled=1

; Подробности в RE_Kenshi_log.txt: кого лечат, кто лечит, чем пациент
; занят (цель и действие), отдан ли приказ и прижился ли он. Пишется
; только при смене состояния, так что журнал не засоряется.
Debug=0
