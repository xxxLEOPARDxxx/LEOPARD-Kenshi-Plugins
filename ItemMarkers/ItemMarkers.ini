; ItemMarkers - пометки на иконках вещей: цвет сорта, краденое, форма
; фракции. Замена LtEast's Rarity Backgrounds и Item Status Indicators.
;
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).

[ItemMarkers]

; 0 - никаких пометок.
Enabled=1

; Пометки видны, пока зажата клавиша (ALT, CTRL+B, ...). NONE - видны всегда.
HoldKey=NONE

; Цвет сорта у брони, оружия, арбалетов и протезов - как в подсказке
; вещи (сорт - по уровню вещи 0..100).
Rarity=1
; 0 - заливка, 1 - рамка, 2 - градиент снизу, 3 - звезда в углу.
RarityStyle=1
; Угол звезды стиля 3: 0 - слева сверху, 1 - справа сверху, 2 - слева снизу,
; 3 - справа снизу.
StarCorner=2
; Яркость цвета, 1..10 (шаг 10%).
RarityStrength=6
; С какого сорта красить, 0..5: 0 и 1 - серый и бежевый (обычные вещи),
; 2 - начиная с синего.
MinGrade=2

; Курсор кражи игры на краденых вещах; размер в пикселях, заметность 1..10.
Stolen=1
StolenSize=16
StolenStrength=9

; Курсор-рука игры на броне, которая является формой фракции.
Faction=1
FactionSize=16
FactionStrength=9

; Глаз в левом нижнем углу значка чертежа, если чертёж уже изучен:
; у торговца сразу видно, что покупать незачем.
Blueprint=1

; В RE_Kenshi_log.txt: первые 200 помеченных вещей и время на пометки.
Debug=0
