; Dynamic Factions - фракции, которые живут сами.
[DynamicFactions]
; 0 - плагин выключен целиком (после изменения - перезапуск игры).
Enabled=1

; Сложность: навыки основателей новой фракции.
; easy - 10, medium - 30, hard - 50, veryhard - 70 ко всем навыкам.
Difficulty=medium

; Деньги новой фракции при основании (рекруты в Хабе просят 3000-6000).
StartMoney=5000

; Клавиша окна с состоянием фракций (открыть/закрыть). NONE - без клавиши.
WindowKey=CTRL+F10

; Real mining/hauling/trade, no passive income; live setting.
Work=1
; Maximum scouting/resource radius around the Hub (500-5000 metres).
MineRadius=3000

; 1 - подробности в RE_Kenshi_log.txt: тики фракции, сохранение и загрузка.
Debug=0
