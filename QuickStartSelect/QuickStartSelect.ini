; QuickStartSelect — окно «Выберите предысторию» списком.
;
; Читается при запуске игры и при каждом открытии окна. Менять удобнее во
; вкладке MCM окна «Настройки» игры (нужен мод ModConfigMenu).

[QuickStartSelect]

; 0 отключает плагин целиком: остаётся окно игры со стрелками.
Enabled=1

; wide — список слева, описание справа; compact — узкое окно, описание
; под списком. Кнопка M в окне переключает и запоминает здесь.
Layout=wide

; az — по названию, difficulty — по сложности. SortDesc=1 — обратный
; порядок (Z-A, сначала тяжёлые). Кнопки в окне меняют и запоминают.
Sort=az
SortDesc=0

; 1 — спросить перед началом игры (двойной щелчок по строке или «Начать»).
ConfirmBegin=1

; 1 — правый клик по строке других настроек возвращает значение по умолчанию.
RightClickReset=1

; Подробности в RE_Kenshi_log.txt: все предыстории со сложностью и расами,
; строки других настроек и их значения по умолчанию.
Debug=0

; Свои сложности под 6 встроенных цветов: названия сложностей стартов из
; других модов через запятую (достаточно части слова). Такие старты
; красятся этим цветом и сортируются как эта ступень. Пример:
; DifficultyVeryHard=Бип, Оно снова хочет есть
DifficultyVeryEasy=
DifficultyEasy=
DifficultyNormal=
DifficultyAboveNormal=
DifficultyHard=
DifficultyVeryHard=
