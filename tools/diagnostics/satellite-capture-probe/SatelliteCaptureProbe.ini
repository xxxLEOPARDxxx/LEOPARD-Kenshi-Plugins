[Probe]
; No automatic captures. Ctrl+Shift+Y while Kenshi focused and global map open.
;0 actual main-camera control;1 independent camera same view;2 independent ortho;
;3 independent ortho temporarily bound to Renderer::camera;4 actual main-camera ortho.
Mode=0
; Use current camera's GLOBAL 1024m grid cell; no per-shot terrain-height plane.
CurrentCell=1
CellX=0
CellZ=0
; Only existing stable mesh-loaded proxy entities; no Town show/load/rebuild call.
ExistingProxies=0

; Private file-control sessions only: do not steal focus from the user's editor.
; Still requires EnableRequestFile=1, an open global map and a NEW request token.
AllowBackgroundFileRequests=0
