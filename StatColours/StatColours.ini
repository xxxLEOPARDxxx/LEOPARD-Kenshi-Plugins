; StatColours - цвета чисел в окне характеристик.
; Читается при запуске игры. Менять на ходу удобнее во вкладке MCM
; окна «Настройки» игры (нужен мод ModConfigMenu).
;
; Формат цвета - #RRGGBB, как в HTML. Непонятное значение
; игнорируется, в журнал RE_Kenshi уходит строка об этом.
;
; LevelN - цвет для навыков от N до N+9. Level100 - ровно сто,
; Above100 - выше сотни, это бывает только с прибавкой от
; снаряжения.

[Colours]

; Цвета «auto» берутся из палитры интерфейса (kenshi_colours.xml) и
; следуют за модом интерфейса поверх неё.
; 0 — не спрашивать палитру у игры вовсе, оставить запасные цвета.
; Аварийный выключатель: если игра начнёт падать после загрузки
; сейва, первым делом поставьте сюда 0.
UseGameTheme=1
Level0=#8C3A3A
Level10=#A34A42
Level20=#B25E42
Level30=#BE7644
Level40=#C79149
Level50=#CBAA52
Level60=#C2B25A
Level70=#AEB25E
Level80=#96AC5F
Level90=#7EA560
Level100=#6C9E63
Above100=#9A7BC8

; Скобки с поправкой от снаряжения: (+3) или (-4).
; Brackets - сами скобки, Bonus и Penalty - число внутри.
; BracketSide - с какой стороны от числа: left или right.
; Слева скобка может налезать на длинные названия навыков -
; тогда поставьте right, справа она никому не мешает.
BracketSide=left
; auto - взять из палитры игры, data/gui/colours/kenshi_colours.xml
; (и из мода на интерфейс, если он её перекрыл). Так служебные цвета
; едут вместе с темой, а не спорят с ней. Можно поставить и свой #RRGGBB.
Brackets=auto
Bonus=auto
Penalty=auto
; Labels - подписи в разбивке под описанием навыка.
Labels=auto

; Расовые множители опыта - блок под «Качествами» с навыками, у
; которых раса качается быстрее или медленнее (x1,20 - зелёным,
; x0,80 - красным). Если строк много, окно вытягивается вниз.
; 1 - показывать, 0 - нет.
; HoldKey - блок виден, только пока клавиша зажата: ALT, CTRL, SHIFT;
; NONE - виден всегда. На ALT в сборке ещё GearCompare, AssignedWorkers
; и подсветка - это не мешает, просто совпадёт.
[RacialXP]
Show=1
HoldKey=ALT
; ShowRate - за названием навыка в описании «(Тек. скор. прокачки:
; 0,510)»: расовый множитель * множитель уровня (по XP_Overhaul, без
; него - по ванильной кривой). 1 - показывать, 0 - нет.
ShowRate=1

[Debug]
; 1 - выкладывать в журнал RE_Kenshi разбор выбранного навыка:
; все числа, какими игра его описывает. Строка на каждый навык,
; включать только для отладки.
Debug=0
